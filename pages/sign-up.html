<body class="">
  <a class="skip-link" href="#main-content">Skip to main content</a>



  <main id="main-content">

    <section class="auth-split auth-split--single">
      <div class="auth-top-tools">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"><span data-icon="moon" data-size="18"></span></button>
        <button type="button" class="icon-btn" data-rtl-toggle aria-label="Toggle RTL"><span class="rtl-label mono" style="font-size:0.72rem;font-weight:700">RTL</span></button>
      </div>
      <div class="auth-split__form-col">
        <div class="auth-split__panel">
          <div style="display:flex;align-items:center;justify-content:center;margin-bottom:24px">
            <a class="brand" href="index.html">
              <span class="brand__mark" data-icon="heart-pulse" data-size="20"></span>
              <span class="brand__text"><span class="brand__name">LifeBridge</span><span class="brand__sub">Nursing &amp; Paramedical</span></span>
            </a>
          </div>

          <span class="eyebrow eyebrow--gold">New Student Enrolment</span>
          <h1 style="font-size:clamp(1.75rem,3vw,2.2rem)">Create Your Portal Account</h1>
          <p style="margin-bottom:18px">Activate your LifeBridge LMS credentials using your provisional admission email.</p>

          <form class="form-grid" data-validate data-redirect="dashboard/overview.html" data-success-msg="Account created! Opening your Student Dashboard...">
            <div class="field"><label class="field__label" for="su-name">Full Name *</label><input id="su-name" class="field__input" type="text" required placeholder="e.g. Aisha Khan"><span class="field__error"></span></div>
            <div class="field"><label class="field__label" for="su-email">Email Address *</label><input id="su-email" class="field__input" type="email" required placeholder="student@lifebridge.edu"><span class="field__error"></span></div>
            <div class="field"><label class="field__label" for="su-prog">Program *</label><select id="su-prog" class="field__select" required><option value="">Select</option><option>B.Sc. Nursing</option><option>GNM Diploma</option><option>DMLT</option><option>Radiology Tech</option><option>EMT Paramedic</option></select><span class="field__error"></span></div>
            <div class="field">
              <label class="field__label" for="su-pass">Create Password (min 8 chars) *</label>
              <div class="field__password-wrap">
                <input id="su-pass" class="field__input" type="password" required minlength="8" placeholder="Create strong password">
                <button type="button" class="password-toggle" data-toggle-password aria-label="Show password"><span data-icon="eye" data-size="18"></span></button>
              </div>
              <span class="field__error"></span>
            </div>
            <div class="field">
              <label class="field__label" for="su-pass2">Confirm Password *</label>
              <input id="su-pass2" class="field__input" type="password" required data-match="#su-pass" placeholder="Re-enter password">
              <span class="field__error"></span>
            </div>
            <button type="submit" class="btn btn-accent" style="width:100%">Activate Student Account</button>
            <div class="form-success-banner"><span data-icon="check-circle" data-size="20"></span><span>Portal activated! Launching your dashboard...</span></div>
          </form>

          <div class="auth-social-divider"><span>Or continue with</span></div>
          <div class="auth-social-row">
            <button type="button" class="auth-social-btn" aria-label="Continue with Google">
              <span data-icon="google" data-size="18"></span>
              <span>Google</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Continue with Apple">
              <span data-icon="apple" data-size="18"></span>
              <span>Apple</span>
            </button>
          </div>

          <p style="margin-top:20px;font-size:0.9rem;text-align:center">Already registered? <a href="login.html" style="font-weight:700">Sign In</a></p>
        </div>
      </div>
    </section>

  </main>




  <script src="../assets/js/plugins/icons.js" defer></script>
  <script src="../assets/js/plugins/tilt.js" defer></script>
  <script src="../assets/js/plugins/counter.js" defer></script>
  <script src="../assets/js/plugins/charts.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
